---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dsv4-benchmark-jobset-proof-script
  namespace: inference
data:
  run.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    export HF_HOME=/hf-cache
    export HF_HUB_CACHE=/hf-cache/hub
    export HF_HUB_OFFLINE=1
    export TRANSFORMERS_OFFLINE=1
    export PATH=$PATH:/usr/local/bin

    JOBSET_NAME="${JOBSET_NAME:-dsv4-bench-proof-010}"
    WORLD_SIZE="${WORLD_SIZE:-10}"
    # Scoped by APPMANA_JOBSET_UID (stamped by the core JobSet controller,
    # unique per JobSet object, identical across all ranks of one real run)
    # rather than just JOBSET_NAME (a fixed human-chosen string reused
    # across every delete+recreate retry of "the same" benchmark). Without
    # this, a stale done marker or host-rendezvous file left behind by a
    # prior failed attempt under the same name gets picked up by the next
    # attempt's workers as if the new run were already finished, tearing
    # down their Ray processes while the new leader is still waiting for
    # them -- confirmed live 2026-07-16.
    RESULT_DIR="/jit-shared/dsv4-jobset-results/${JOBSET_NAME}/${APPMANA_JOBSET_UID:-nouid}"
    DONE_FILE="${RESULT_DIR}/done"
    if [ "${APPMANA_DSV4_SCOPE_COMPILER_CACHES:-1}" = "1" ]; then
      APPMANA_DSV4_COMPILER_CACHE_BASE="/jit-local/jobset-proof/${JOBSET_NAME}"
      export TRITON_CACHE_DIR="${APPMANA_DSV4_COMPILER_CACHE_BASE}/triton"
      export TORCH_EXTENSIONS_DIR="${APPMANA_DSV4_COMPILER_CACHE_BASE}/torch-ext"
      export CUDA_CACHE_PATH="${APPMANA_DSV4_COMPILER_CACHE_BASE}/cuda"
      export TORCHINDUCTOR_CACHE_DIR="${APPMANA_DSV4_COMPILER_CACHE_BASE}/inductor"
      export XDG_CACHE_HOME="${APPMANA_DSV4_COMPILER_CACHE_BASE}/xdg"
    else
      export TRITON_CACHE_DIR="${TRITON_CACHE_DIR:-/jit-local/jobset-proof/triton}"
      export TORCH_EXTENSIONS_DIR="${TORCH_EXTENSIONS_DIR:-/jit-local/jobset-proof/torch-ext}"
      export CUDA_CACHE_PATH="${CUDA_CACHE_PATH:-/jit-local/jobset-proof/cuda}"
      export TORCHINDUCTOR_CACHE_DIR="${TORCHINDUCTOR_CACHE_DIR:-/jit-local/jobset-proof/inductor}"
      export XDG_CACHE_HOME="${XDG_CACHE_HOME:-/jit-local/jobset-proof/xdg}"
    fi
    # The SeaweedFS CSI staging mount is routinely unhealthy for the first ~30s
    # of a pod's life: its health monitor times out the 5s check, unmounts the
    # stale publish path, and re-publishes. Any write to /jit-shared inside that
    # window dies with "Transport endpoint is not connected" and, at
    # backoffLimit 0, takes the whole 10-rank JobSet with it. Wait the mount out.
    SHARED_MOUNT_WAIT_SECONDS="${APPMANA_DSV4_SHARED_MOUNT_WAIT_SECONDS:-300}"
    shared_mount_ready() {
      local probe="/jit-shared/.mount-probe.${POD_NAME:-$$}"
      timeout 10 sh -c ": >'$probe' && rm -f '$probe'" 2>/dev/null
    }
    mount_waited=0
    until shared_mount_ready; do
      if [ "$mount_waited" -ge "$SHARED_MOUNT_WAIT_SECONDS" ]; then
        echo "[boot] FATAL: /jit-shared not writable after ${SHARED_MOUNT_WAIT_SECONDS}s (seaweedfs CSI mount never recovered)"
        exit 14
      fi
      echo "[boot] /jit-shared not writable yet (${mount_waited}s), waiting for seaweedfs CSI recovery"
      sleep 5
      mount_waited=$((mount_waited + 5))
    done
    if [ "$mount_waited" -gt 0 ]; then
      echo "[boot] /jit-shared became writable after ${mount_waited}s"
    fi

    mkdir -p "$RESULT_DIR" \
             "$TRITON_CACHE_DIR" \
             "$TORCH_EXTENSIONS_DIR" \
             "$CUDA_CACHE_PATH" \
             "$TORCHINDUCTOR_CACHE_DIR" \
             "$XDG_CACHE_HOME"
    BOOT_LOG="${RESULT_DIR}/${POD_NAME}.boot.log"
    log_line() {
      printf '%s\n' "$*" | tee -a "$BOOT_LOG"
    }

    # Ray's own per-process logs (raylet.err/out, gcs_server.err, python-core-*
    # -- far more detailed than what's forwarded to vllm-server.log) live at
    # /tmp/ray/session_latest/logs/ and are lost the instant this pod is
    # deleted. With backoffLimit=0, one rank failing makes the JobSet kill
    # every sibling pod within seconds, so a crash on one node used to mean
    # zero forensic data for any of them. Copy Ray's logs to the shared PVC
    # on every exit path (normal, `set -e` error, or SIGTERM from the
    # JobSet's fail-fast teardown) so a future crash is diagnosable instead
    # of "transient".
    RAY_LOG_ARCHIVE_DIR="${RESULT_DIR}/ray-logs-${POD_NAME}"
    preserve_ray_logs() {
      mkdir -p "$RAY_LOG_ARCHIVE_DIR" 2>/dev/null || return 0
      if [ -d /tmp/ray/session_latest/logs ]; then
        cp -r /tmp/ray/session_latest/logs/. "$RAY_LOG_ARCHIVE_DIR/" 2>/dev/null || true
      fi
      # Best-effort cluster-state-at-exit snapshot; ray CLI may itself be
      # unreachable if the crash took down the local raylet.
      timeout 5 ray status >"$RAY_LOG_ARCHIVE_DIR/ray-status-at-exit.txt" 2>&1 || true
    }
    trap preserve_ray_logs EXIT
    trap 'preserve_ray_logs; exit 143' TERM
    # Verbose raylet/GCS C++ logging around connection/heartbeat/lease
    # handling -- the default level does not log enough to explain a raw
    # "connection error code 2, End of file" from a dead actor.
    export RAY_BACKEND_LOG_LEVEL="${RAY_BACKEND_LOG_LEVEL:-info}"

    if [ "${APPMANA_DSV4_ENABLE_PY_STACK_SIGNAL:-1}" = "1" ]; then
      PY_DEBUG_DIR="${APPMANA_DSV4_COMPILER_CACHE_BASE:-/jit-local/jobset-proof}/${JOBSET_NAME}/python-debug"
      mkdir -p "$PY_DEBUG_DIR"
      cat >"${PY_DEBUG_DIR}/sitecustomize.py" <<'PY'
    import faulthandler
    import os
    import signal
    import sys

    faulthandler.enable(file=sys.stderr, all_threads=True)
    try:
        faulthandler.register(signal.SIGUSR2, file=sys.stderr, all_threads=True, chain=False)
        print(
            f"[python-debug] registered SIGUSR2 stack dump pid={os.getpid()}",
            file=sys.stderr,
            flush=True,
        )
    except Exception as exc:
        print(
            f"[python-debug] failed to register SIGUSR2 stack dump: {exc!r}",
            file=sys.stderr,
            flush=True,
        )
    PY
      export PYTHONPATH="${PY_DEBUG_DIR}${PYTHONPATH:+:${PYTHONPATH}}"
      log_line "[python-debug] enabled SIGUSR2 stack dumps via $PY_DEBUG_DIR"
    fi

    run_vllm_bench_matrix() {
      if [ "${APPMANA_DSV4_RUN_VLLM_BENCH:-0}" != "1" ]; then
        return 0
      fi
      local bench_dir="${RESULT_DIR}/vllm-bench"
      local input_len="${APPMANA_DSV4_BENCH_INPUT_LEN:-16000}"
      local output_len="${APPMANA_DSV4_BENCH_OUTPUT_LEN:-512}"
      local seed="${APPMANA_DSV4_BENCH_SEED:-42}"
      local backend="${APPMANA_DSV4_BENCH_BACKEND:-openai-chat}"
      local endpoint="${APPMANA_DSV4_BENCH_ENDPOINT:-/v1/chat/completions}"
      local extra_body="${APPMANA_DSV4_BENCH_EXTRA_BODY:-}"
      local extra_args="${APPMANA_DSV4_BENCH_EXTRA_ARGS:-}"
      if [ -z "$extra_body" ] && [ "$backend" = "openai-chat" ]; then
        extra_body='{"chat_template_kwargs":{"enable_thinking":false,"thinking":false}}'
      elif [ -z "$extra_body" ]; then
        extra_body='{}'
      fi
      local timeout_s="${APPMANA_DSV4_BENCH_TIMEOUT_SECONDS:-1800}"
      mkdir -p "$bench_dir"
      local concurrencies="${APPMANA_DSV4_BENCH_CONCURRENCIES:-1 2}"
      concurrencies="${concurrencies//,/ }"
      for concurrency in $concurrencies; do
        local label="dsv4-${APPMANA_DSV4_REPO_ID##*/}-c${concurrency}-in${input_len}-out${output_len}"
        local result_file="${label}.json"
        log_line "[benchmark] vllm bench serve label=$label backend=$backend endpoint=$endpoint input_len=$input_len output_len=$output_len concurrency=$concurrency extra_body=$extra_body extra_args=$extra_args timeout_s=$timeout_s"
        read -r -a bench_extra_args <<< "$extra_args"
        timeout --preserve-status "$timeout_s" vllm bench serve \
          --backend "$backend" \
          --base-url http://127.0.0.1:8080 \
          --endpoint "$endpoint" \
          --model "$APPMANA_DSV4_REPO_ID" \
          --dataset-name random \
          --random-input-len "$input_len" \
          --random-output-len "$output_len" \
          --num-prompts "$concurrency" \
          --max-concurrency "$concurrency" \
          --request-rate inf \
          --ignore-eos \
          --temperature 0 \
          --seed "$seed" \
          --percentile-metrics ttft,tpot,itl,e2el \
          --metric-percentiles 50,90,99 \
          --extra-body "$extra_body" \
          --label "$label" \
          --metadata "jobset=${JOBSET_NAME}" "pp=${VLLM_PIPELINE_PARALLEL_SIZE:-10}" "tp=${VLLM_TENSOR_PARALLEL_SIZE:-1}" \
          --save-result \
          --save-detailed \
          --result-dir "$bench_dir" \
          --result-filename "$result_file" \
          "${bench_extra_args[@]}" \
          2>&1 | tee "${bench_dir}/${label}.log"
        python3 - "$bench_dir/$result_file" <<'PY' | while IFS= read -r line; do log_line "$line"; done
    import json, sys
    path = sys.argv[1]
    data = json.load(open(path))
    tpot = data.get("median_tpot_ms") or data.get("mean_tpot_ms")
    generated = data.get("total_output_tokens") or data.get("total_generated_tokens")
    tok_s = 1000.0 / tpot if tpot else None
    print(
        "[benchmark-summary] "
        f"file={path} "
        f"completed={data.get('completed')} "
        f"failed={data.get('failed')} "
        f"total_generated_tokens={generated} "
        f"output_throughput={data.get('output_throughput')} "
        f"mean_ttft_ms={data.get('mean_ttft_ms')} "
        f"median_ttft_ms={data.get('median_ttft_ms')} "
        f"mean_tpot_ms={data.get('mean_tpot_ms')} "
        f"median_tpot_ms={data.get('median_tpot_ms')} "
        f"decode_tok_s_per_stream_from_tpot={tok_s}"
    )
    if not data.get("completed"):
        raise SystemExit(
            f"benchmark produced no successful requests: "
            f"failed={data.get('failed')} errors={data.get('errors')}"
        )
    PY
      done
    }

    run_needle_matrix() {
      if [ "${APPMANA_DSV4_RUN_NEEDLE_BENCH:-0}" != "1" ]; then
        return 0
      fi
      local needle_dir="${RESULT_DIR}/needle-bench"
      local timeout_s="${APPMANA_DSV4_BENCH_TIMEOUT_SECONDS:-1800}"
      local seed="${APPMANA_DSV4_NEEDLE_SEED:-0}"
      mkdir -p "$needle_dir"
      # Rows are INPUT_TOKENS:NEEDLE_TOKENS:CONCURRENCY[:SEED], space
      # separated. Every request reproduces a unique needle verbatim, so
      # output length equals the needle length and correctness is exact
      # containment. The seed changes the haystack and the needle; at the
      # model's depth limit single seeds pass or miss on their own, so judge
      # an image on several.
      local rows="${APPMANA_DSV4_NEEDLE_ROWS:-8000:1000:1}"
      local row input_tokens needle_tokens concurrency row_seed
      # A missed needle is a result, not an abort: every row still runs and
      # the leader exits 31 afterwards so the JobSet records the failure.
      NEEDLE_FAILED=0
      local row_index=0
      for row in $rows; do
        row_index=$((row_index + 1))
        IFS=: read -r input_tokens needle_tokens concurrency row_seed <<< "$row"
        seed="${row_seed:-${APPMANA_DSV4_NEEDLE_SEED:-0}}"
        # The ordinal keeps repeated rows (same prompt, run again for
        # determinism) from overwriting each other's results.
        local label="needle-${APPMANA_DSV4_REPO_ID##*/}-row${row_index}-c${concurrency}-in${input_tokens}-needle${needle_tokens}-seed${seed}"
        log_line "[needle] label=$label input_tokens=$input_tokens needle_tokens=$needle_tokens concurrency=$concurrency seed=$seed timeout_s=$timeout_s"
        if ! timeout --preserve-status "$timeout_s" python3 /work/dsv4_needle_bench.py \
          --base-url http://127.0.0.1:8080 \
          --model "$APPMANA_DSV4_REPO_ID" \
          --tokenizer "$APPMANA_LOCAL_MODEL_PATH" \
          --input-tokens "$input_tokens" \
          --needle-tokens "$needle_tokens" \
          --concurrency "$concurrency" \
          --run-seed "$seed" \
          --request-timeout "$timeout_s" \
          --output-json "${needle_dir}/${label}.json" \
          > "${needle_dir}/${label}.log" 2>&1; then
          NEEDLE_FAILED=1
        fi
        if [ ! -s "${needle_dir}/${label}.json" ]; then
          log_line "[needle-summary] label=$label no result file; see ${needle_dir}/${label}.log"
          tail -20 "${needle_dir}/${label}.log" || true
          continue
        fi
        python3 - "${needle_dir}/${label}.json" <<'PY' | while IFS= read -r line; do log_line "$line"; done
    import json, sys
    path = sys.argv[1]
    summary = json.load(open(path))["summary"]
    print(
        "[needle-summary] "
        f"file={path} "
        f"needle_verbatim_passed={summary['needle_verbatim_passed']}/{summary['concurrency']} "
        f"match_ratio_min={summary['match_ratio']['min']} "
        f"prompt_tokens_total={summary['prompt_tokens_total']} "
        f"ttft_s_p50={summary['ttft_s']['p50']} "
        f"prefill_tok_s_p50={summary['per_request_prefill_tok_s']['p50']} "
        f"decode_tok_s_p50={summary['per_request_decode_tok_s']['p50']} "
        f"finish_reasons={json.dumps(summary['finish_reasons'])}"
    )
    PY
      done
    }

    { grep -vE '^127\.0\.1\.1\b' /etc/hosts; echo "${HOST_IP} $(hostname)"; } > /tmp/hosts.new
    cat /tmp/hosts.new > /etc/hosts
    rm -f /tmp/hosts.new

    PRIMARY_IFACE="$(awk '$2=="00000000" {print $1; exit}' /proc/net/route)"
    # Socket interface names are derived here, in-pod, ALWAYS. The fleet
    # carries five different switched-LAN NIC names (enp110s0/enp111s0/
    # enp60s0/eno1/enp38s0 as of 2026-07-23) and they change under OS
    # updates; any name injected by an admission controller or baked into a
    # template goes stale, and Gloo hard-fails on a name that does not exist
    # ("Unable to find address for: eno1", observed live). The default-route
    # interface from this pod's own /proc/net/route is the node's truth.
    if [ -n "${NCCL_SOCKET_IFNAME:-}" ] && [ "$NCCL_SOCKET_IFNAME" != "$PRIMARY_IFACE" ]; then
      log_line "[boot] overriding stale NCCL_SOCKET_IFNAME=$NCCL_SOCKET_IFNAME with $PRIMARY_IFACE"
    fi
    if [ -n "${GLOO_SOCKET_IFNAME:-}" ] && [ "$GLOO_SOCKET_IFNAME" != "$PRIMARY_IFACE" ]; then
      log_line "[boot] overriding stale GLOO_SOCKET_IFNAME=$GLOO_SOCKET_IFNAME with $PRIMARY_IFACE"
    fi
    export NCCL_SOCKET_IFNAME="$PRIMARY_IFACE"
    export GLOO_SOCKET_IFNAME="$PRIMARY_IFACE"
    HOSTS_DIR="${RESULT_DIR}/hosts"
    mkdir -p "$HOSTS_DIR"
    : >"${HOSTS_DIR}/${HOST_IP}"

    # A rank that is still pulling a freshly built image has not run this script
    # yet, so it has not written its host file. The barrier must outlast a cold
    # pull of the vLLM image on a node with no layer cache, or every rank aborts
    # together. 6 minutes was not enough; 30 is.
    HOST_RENDEZVOUS_SECONDS="${APPMANA_DSV4_HOST_RENDEZVOUS_SECONDS:-1800}"
    for _ in $(seq 1 $((HOST_RENDEZVOUS_SECONDS / 2))); do
      if [ "$(find "$HOSTS_DIR" -type f | wc -l)" -ge "$WORLD_SIZE" ]; then
        break
      fi
      sleep 2
    done
    if [ "$(find "$HOSTS_DIR" -type f | wc -l)" -lt "$WORLD_SIZE" ]; then
      log_line "[boot] FATAL: saw $(find "$HOSTS_DIR" -type f | wc -l) JobSet host IPs, expected $WORLD_SIZE after ${HOST_RENDEZVOUS_SECONDS}s (a rank may still be pulling the image)"
      cp "$BOOT_LOG" "${RESULT_DIR}/${POD_NAME}.error"
      exit 10
    fi

    mapfile -t ACTIVE_CHAIN_IPS < <(
      python3 - "$WORLD_SIZE" "$VLLM_RAY_WORKER_IP_ORDER" "$HOSTS_DIR" <<'PY'
    import os, sys
    world = int(sys.argv[1])
    chain = [x for x in sys.argv[2].split(",") if x]
    hosts_dir = sys.argv[3]
    actual = set(os.listdir(hosts_dir))
    active = [ip for ip in chain if ip in actual]
    if len(active) != world:
        raise SystemExit(f"active slice has {len(active)} IPs, expected {world}; active={active}; actual={sorted(actual)}; chain={chain}")
    print("\n".join(active))
    PY
    )

    APPMANA_DSV4_RANK=-1
    for i in "${!ACTIVE_CHAIN_IPS[@]}"; do
      if [ "${ACTIVE_CHAIN_IPS[$i]}" = "$HOST_IP" ]; then
        APPMANA_DSV4_RANK="$i"
        break
      fi
    done
    if [ "$APPMANA_DSV4_RANK" -lt 0 ]; then
      log_line "[boot] FATAL: HOST_IP=$HOST_IP not in VLLM_RAY_WORKER_IP_ORDER=$VLLM_RAY_WORKER_IP_ORDER"
      cp "$BOOT_LOG" "${RESULT_DIR}/${POD_NAME}.error"
      exit 11
    fi
    export APPMANA_DSV4_RANK
    LEADER_HOST_IP="${ACTIVE_CHAIN_IPS[0]}"
    export MASTER_ADDR="$LEADER_HOST_IP"
    export VLLM_HOST_IP="$HOST_IP"
    VLLM_RAY_WORKER_IP_ORDER="$(printf '%s\n' "${ACTIVE_CHAIN_IPS[@]}" | paste -sd, -)"
    export VLLM_RAY_WORKER_IP_ORDER

    VLLM_TP_SIZE="${VLLM_TENSOR_PARALLEL_SIZE:-1}"
    VLLM_PP_SIZE="${VLLM_PIPELINE_PARALLEL_SIZE:-10}"
    VLLM_TP_RANK=$((APPMANA_DSV4_RANK % VLLM_TP_SIZE))
    VLLM_PP_RANK=$((APPMANA_DSV4_RANK / VLLM_TP_SIZE))
    export VLLM_TP_SIZE VLLM_PP_SIZE VLLM_TP_RANK VLLM_PP_RANK

    log_line "[boot] pod=$POD_NAME node=${NODE_NAME:-?} job_index=${JOB_COMPLETION_INDEX:-?} host_ip=$HOST_IP chain_rank=$APPMANA_DSV4_RANK pp_rank=$VLLM_PP_RANK tp_rank=$VLLM_TP_RANK pp_size=$VLLM_PP_SIZE tp_size=$VLLM_TP_SIZE leader=$LEADER_HOST_IP active_order=$VLLM_RAY_WORKER_IP_ORDER iface=$PRIMARY_IFACE gloo_if=$GLOO_SOCKET_IFNAME nccl_if=$NCCL_SOCKET_IFNAME nccl_hca=${NCCL_IB_HCA:-unset} nccl_subnet=${NCCL_IB_SUBNET_AWARE_ROUTING:-unset} nccl_algo=${NCCL_ALGO:-unset} nccl_proto=${NCCL_PROTO:-unset}"

    if [ "$APPMANA_DSV4_RANK" = "0" ]; then
      /opt/appmana-hf-cache/populate.sh
    else
      /opt/appmana-hf-cache/wait.sh
    fi

    materialize_rank_local_model() {
      local repo_id="${APPMANA_DSV4_REPO_ID:-deepseek-ai/DeepSeek-V4-Flash}"
      local repo_cache_name="${repo_id//\//--}"
      local cache_root="/hf-cache/hub/models--$repo_cache_name"
      local expected_snapshot
      expected_snapshot="$(cat "$cache_root/refs/main")"
      local src="$cache_root/snapshots/$expected_snapshot"

      test -d "$src"
      test -f "$src/config.json"
      test -f "$src/model.safetensors.index.json"
      python3 - "$src/config.json" "$repo_id" <<'PY'
    import json, sys
    config = json.load(open(sys.argv[1]))
    repo_id = sys.argv[2]
    qc = config.get("quantization_config") or {}
    if repo_id == "deepseek-ai/DeepSeek-V4-Flash":
        assert qc.get("quant_method") == "fp8", qc
    elif repo_id == "appmana/deepseek-v4-int4-int8":
        assert qc.get("quant_method") == "dsv4_int", qc
    else:
        raise AssertionError(f"unsupported APPMANA_DSV4_REPO_ID={repo_id!r}")
    PY

      python3 - "$src" "$APPMANA_DSV4_RANK" <<'PY' | while IFS= read -r line; do log_line "$line"; done
    import hashlib
    import os
    import sys

    src = sys.argv[1]
    rank = sys.argv[2]
    names = [
        "config.json",
        "generation_config.json",
        "model.safetensors.index.json",
        "tokenizer.json",
        "tokenizer_config.json",
        "special_tokens_map.json",
    ]
    for name in names:
        path = os.path.join(src, name)
        if not os.path.exists(path):
            print(f"[model-cache] meta rank={rank} {name} missing")
            continue
        with open(path, "rb") as f:
            digest = hashlib.sha256(f.read()).hexdigest()[:16]
        print(f"[model-cache] meta rank={rank} {name} sha256={digest}")
    PY

      if [ -n "${APPMANA_DSV4_PP_LAYER_PARTITION:-}" ]; then
        export VLLM_PP_LAYER_PARTITION="$APPMANA_DSV4_PP_LAYER_PARTITION"
      else
        # Speculative decoding puts the grafted DSpark MTP draft stages on
        # the last PP rank next to the LM head; layer_partition detects them
        # from the checkpoint and charges that rank for them. Without
        # --speculative-config the draft is never loaded, so opt out.
        draft_partition_args=()
        case " ${APPMANA_DSV4_SERVER_EXTRA_ARGS:-} " in
          *" --speculative-config"*) ;;
          *) draft_partition_args=(--no-draft-zero-last) ;;
        esac
        export VLLM_PP_LAYER_PARTITION="$(
          python3 /usr/local/lib/python3.12/dist-packages/vllm/layer_partition.py partition \
            --config "$src/config.json" \
            --index "$src/model.safetensors.index.json" \
            --pp-size "${VLLM_PIPELINE_PARALLEL_SIZE:-10}" \
            "${draft_partition_args[@]}"
        )"
      fi

      # $src is the SeaweedFS-backed shared snapshot (hf-cache-seaweed PVC).
      # Stage only this rank's ~1/pp_size share of shards onto local disk:
      # real-copy shards containing a locally-owned tensor, symlink the rest
      # back to $src. safetensors only reads a symlinked shard's small
      # header (should_skip_pp_weight already skips every get_tensor() call
      # for its tensors), so SeaweedFS is only touched for cheap headers on
      # the ~9/10 of shards this rank doesn't own, never their bulk data.
      # See forks-vllm-ampere/tools/prep_pp_shards.py (delivered here via
      # the ConfigMap so no image rebuild is needed to pick up changes).
      # Importing vllm.config.ModelConfig inside prep_pp_shards.py triggers
      # vLLM's own INFO logging to stdout before the script's final
      # print(dest_dir) -- take only the last line, or that logging noise
      # ends up concatenated into the path and breaks --model downstream.
      APPMANA_LOCAL_MODEL_PATH="$(
        python3 /work/prep_pp_shards.py \
          --source-dir "$src" \
          --dest-root /shard-cache-local \
          --pp-rank "$VLLM_PP_RANK" \
          --pp-size "$VLLM_PP_SIZE" \
          --trust-remote-code \
          --gc \
        | tail -n1
      )"
      export APPMANA_LOCAL_MODEL_PATH
      log_line "[model-cache] rank=$APPMANA_DSV4_RANK path=$APPMANA_LOCAL_MODEL_PATH partition=$VLLM_PP_LAYER_PARTITION"
    }
    materialize_rank_local_model
    if [ "${APPMANA_DSV4_PREWARM_ONLY:-0}" = "1" ]; then
      log_line "[prewarm] complete rank=$APPMANA_DSV4_RANK path=$APPMANA_LOCAL_MODEL_PATH"
      exit 0
    fi

