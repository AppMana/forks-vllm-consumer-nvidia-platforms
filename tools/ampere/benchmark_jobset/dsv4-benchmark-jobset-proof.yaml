    pkill -9 -f '(^|/)(gcs_server|raylet|plasma_store|dashboard_agent|dashboard.py|monitor.py|log_monitor.py)( |$)' >/dev/null 2>&1 || true
    rm -rf /tmp/ray/session_* /tmp/ray/session_latest /tmp/ray/ray_current_cluster

    export APPMANA_DSV4_RAY_PORT="${APPMANA_DSV4_RAY_PORT:-26379}"
    if [ "$APPMANA_DSV4_RANK" = "0" ]; then
      export RAY_ADDRESS="$LEADER_HOST_IP:$APPMANA_DSV4_RAY_PORT"
      bash /vllm-workspace/examples/ray_serving/multi-node-serving.sh leader \
        --ray_cluster_size="$WORLD_SIZE" --node-ip-address="$HOST_IP" \
        --ray_port="$APPMANA_DSV4_RAY_PORT" --ray_init_timeout=1200
      for _ in $(seq 1 240); do
        if ray status 2>/dev/null | grep -q "1 node"; then
