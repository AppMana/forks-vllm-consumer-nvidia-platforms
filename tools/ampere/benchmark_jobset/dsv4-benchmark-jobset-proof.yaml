    import http.client
    import json
    import os
    import time
    import urllib.error
    import urllib.request

    out_path = __import__("sys").argv[1]
    model = __import__("sys").argv[2]
    sanity_deadline_s = int(os.environ.get("APPMANA_DSV4_SANITY_TIMEOUT_SECONDS", "900"))
    def run_case(name, chat_template_kwargs, max_tokens=512, temperature=0.6):
        payload = {
            "model": model,
            "messages": [
                {"role": "system", "content": "Answer the user accurately and concisely."},
                {"role": "user", "content": "What is the capital of France? Reply with the city name."},
            ],
            "max_tokens": max_tokens,
            "temperature": temperature,
            "top_p": 0.95,
            "chat_template_kwargs": chat_template_kwargs,
        }
        req = urllib.request.Request(
            "http://127.0.0.1:8080/v1/chat/completions",
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        start = time.time()
        deadline = start + sanity_deadline_s
        attempts = 0
        while True:
            attempts += 1
            try:
                with urllib.request.urlopen(req, timeout=120) as resp:
                    body = json.loads(resp.read())
                break
            except (
                http.client.RemoteDisconnected,
                TimeoutError,
                urllib.error.URLError,
            ) as exc:
                if time.time() >= deadline:
                    raise
                print(
                    "[sanity-retry]",
                    json.dumps(
                        {
                            "case": name,
                            "attempt": attempts,
                            "error": repr(exc),
                        }
                    ),
                    flush=True,
                )
                time.sleep(5)
        elapsed = time.time() - start
        message = body["choices"][0]["message"]
        text = message.get("content") or ""
        reasoning = message.get("reasoning_content") or message.get("reasoning") or ""
        combined = f"{reasoning}\n{text}".strip()
        bad_fragments = (
            "####",
            "The The The",
            "capital capital capital",
            "France France France France",
            "ParisParis",
        )
        valid = (
            "paris" in text.lower()
            and len(combined) < 4000
            and not any(fragment in combined for fragment in bad_fragments)
        )
        return {
            "name": name,
            "valid": valid,
            "elapsed_s": elapsed,
            "text": text,
            "reasoning": reasoning,
            "normalized_text": text.rstrip("#").strip(),
            "response": body,
        }

    cases = [
        run_case(
            "no_thinking",
            {"enable_thinking": False, "thinking": False},
            max_tokens=64,
            temperature=0.0,
        ),
        run_case(
            "thinking",
            {"enable_thinking": True, "thinking": True},
            max_tokens=512,
            temperature=0.6,
        ),
    ]
    valid = all(case["valid"] for case in cases)
    result = {
        "valid": valid,
        "cases": cases,
    }
    with open(out_path, "w") as f:
        json.dump(result, f, indent=2)
    print(
        "[sanity]",
        json.dumps(
            {
                "valid": valid,
                "cases": [
                    {
                        "name": case["name"],
                        "valid": case["valid"],
                        "elapsed_s": case["elapsed_s"],
                        "text": case["text"],
                        "reasoning_prefix": case["reasoning"][:80],
                    }
                    for case in cases
                ],
            }
        ),
        flush=True,
    )
    if not valid:
        raise SystemExit(30)
    PY
      fi
      if [ "${APPMANA_DSV4_HOLD_AFTER_SANITY:-0}" = "1" ]; then
        log_line "[leader] holding after sanity with vLLM server alive"
        while kill -0 "$server_pid" 2>/dev/null; do
