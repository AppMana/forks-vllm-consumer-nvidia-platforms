      run_vllm_bench_matrix
      touch "$DONE_FILE"
      if [ "${NEEDLE_FAILED:-0}" = "1" ]; then
        log_line "[leader] needle benchmark missed at least one row"
        ray stop --force || true
        exit 31
      fi
      ray stop --force || true
      wait "$server_pid" || true
    else
      bash /vllm-workspace/examples/ray_serving/multi-node-serving.sh worker \
        --ray_address="$LEADER_HOST_IP" --node-ip-address="$HOST_IP" \
        --ray_port="$APPMANA_DSV4_RAY_PORT" --ray_init_timeout=1200 &
      ray_pid=$!
      while [ ! -f "$DONE_FILE" ]; do
        if ! kill -0 "$ray_pid" 2>/dev/null; then
          echo "[worker] ray worker exited before done" | tee "${RESULT_DIR}/${POD_NAME}.error"
          exit 40
        fi
        sleep 5
      done
      ray stop --force || true
      kill "$ray_pid" >/dev/null 2>&1 || true
      wait "$ray_pid" || true
    fi
  prep_pp_shards.py: |
    # SPDX-License-Identifier: Apache-2.0
    # SPDX-FileCopyrightText: Copyright contributors to the vLLM project
    """Stage a PP-rank-local subset of a safetensors checkpoint as a partial
    local HF cache.

    Each PP rank only needs its own contiguous slice of hidden layers (see
    vllm.model_executor.model_loader.pp_weight_filter). Reading the rest of the
    checkpoint every load is wasted I/O against a shared, network-backed mount
    (e.g. a SeaweedFS PVC), so the owned shards are brought onto local disk and
    the rest resolve back to the shared cache -- safetensors only reads a
    shard's header until get_tensor() is called for a specific name, and
    should_skip_pp_weight already causes the loader to skip get_tensor() for
    every tensor in a foreign shard, so its bulk data is never read over the
    network.

    The local cache is a standard HF hub cache, not a bespoke layout:

        <dest-root>/hub/models--<org>--<name>/
            blobs/<etag>                  # content-addressed; owned shards only
            snapshots/<rev>/<filename>    # symlinks: owned -> local blob,
                                          #           foreign -> source blob
            refs/main                     # <rev>

    Blob names are the source cache's own content hashes, so "copy only what is
    missing" across partition/pp_size changes is inherited from the HF layout
    rather than reinvented: an ownership change repoints snapshot symlinks in
    place and copies just the blobs the local blobs/ directory lacks. The staged
    model path is the snapshot directory -- identical on every rank (vLLM's Ray
    executor resolves one --model path string independently on each worker's
    node; confirmed live 2026-07-16 that a rank-dependent path breaks remote
    workers), with per-node divergence living entirely in which blobs are local.

    ``--gc`` prunes snapshots of other revisions, local blobs that do not
    belong to the current checkpoint, and directories left by the older staging
    layouts (16-hex config dirs, store/) -- their real files are harvested into
    blobs/ by hardlink during staging first, so reclaiming them never re-reads
    the network. Blobs of the current checkpoint are kept even when the current
    partition does not reference them: partitions are additive against one
    checkpoint, so a partition change never re-copies a blob any earlier
    partition already staged.

    Usage:
        python prep_pp_shards.py --source-dir /hf-cache/.../snapshots/<rev> \
            --dest-root /shard-cache-local --pp-rank 3 --pp-size 12 [--gc]
    """

    from __future__ import annotations

    import argparse
    import contextlib
    import importlib.util
    import json
    import os
    import re
    import shutil
    import sys

    SAFE_WEIGHTS_INDEX_NAME = "model.safetensors.index.json"
    COMPLETE_MARKER = ".prep-complete"
    _LEGACY_CONFIG_DIR_RE = re.compile(r"^[0-9a-f]{16}$")
    _LEGACY_STORE_DIR = "store"
    _CLASSIFY_SHARDS = None


    def _classify_shards(
        weight_map: dict[str, str],
        local_layer_range: tuple[int, int] | None,
        *,
        is_first_pipeline_rank: bool,
        is_last_pipeline_rank: bool,
    ) -> dict[str, bool]:
        """Load the pure classifier without executing model_loader/__init__.py."""
        global _CLASSIFY_SHARDS
        if _CLASSIFY_SHARDS is None:
            import vllm

            module_path = os.path.join(
                os.path.dirname(vllm.__file__),
                "model_executor",
                "model_loader",
                "pp_weight_filter.py",
            )
            spec = importlib.util.spec_from_file_location(
                "_vllm_standalone_pp_weight_filter", module_path
            )
            if spec is None or spec.loader is None:
                raise ImportError(f"Cannot load PP weight classifier from {module_path}")
            module = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(module)
            _CLASSIFY_SHARDS = module.classify_shards
        return _CLASSIFY_SHARDS(
            weight_map,
            local_layer_range,
            is_first_pipeline_rank=is_first_pipeline_rank,
            is_last_pipeline_rank=is_last_pipeline_rank,
        )


    def _parse_source_snapshot(source_dir: str) -> tuple[str, str]:
        """Return (repo_dir_name, revision) from an HF-cache snapshot path
        ``.../hub/models--org--name/snapshots/<rev>``."""
        source_dir = os.path.abspath(source_dir)
        rev = os.path.basename(source_dir)
        snapshots = os.path.dirname(source_dir)
        repo = os.path.dirname(snapshots)
        repo_name = os.path.basename(repo)
        if os.path.basename(snapshots) != "snapshots" or not repo_name.startswith(
            "models--"
        ):
            raise ValueError(
                f"--source-dir must be an HF cache snapshot directory "
                f"(.../hub/models--*/snapshots/<rev>), got {source_dir}"
            )
        return repo_name, rev


    def _local_repo_dir(dest_root: str, repo_name: str) -> str:
        return os.path.join(dest_root, "hub", repo_name)


    def _source_blob(source_dir: str, filename: str) -> str:
        """Resolve a snapshot entry to its blob (or to itself if not a link)."""
        return os.path.realpath(os.path.join(source_dir, filename))


    def _is_complete(
        snap_dir: str,
        source_dir: str,
        blobs_dir: str,
        needs_copy: dict[str, bool],
    ) -> bool:
        if not os.path.exists(os.path.join(snap_dir, COMPLETE_MARKER)):
            return False
        blobs_real = os.path.realpath(blobs_dir)
        for shard_filename, owned in needs_copy.items():
            path = os.path.join(snap_dir, shard_filename)
            if not os.path.islink(path) or not os.path.exists(path):
                return False
            target = os.path.realpath(path)
            src_blob = _source_blob(source_dir, shard_filename)
            if owned:
                if os.path.dirname(target) != blobs_real:
                    return False
                if os.path.getsize(target) != os.path.getsize(src_blob):
                    return False
            else:
                if target != src_blob:
                    return False
        return True


    def _ensure_local_blob(
        dest_root: str, blobs_dir: str, source_dir: str, shard_filename: str
    ) -> str:
        """Ensure the shard's blob exists locally; return its path.

        Prefer hardlinking a real copy left behind by the older staging layouts
        (16-hex config dirs, store/<ckpt>/) on the same filesystem over
        re-copying bulk data from the network-backed source.
        """
        src_blob = _source_blob(source_dir, shard_filename)
        etag = os.path.basename(src_blob)
        blob_path = os.path.join(blobs_dir, etag)
        src_size = os.path.getsize(src_blob)
        if os.path.exists(blob_path):
            if os.path.getsize(blob_path) == src_size:
                return blob_path
            os.remove(blob_path)

        os.makedirs(blobs_dir, exist_ok=True)

        legacy_candidates = []
        with contextlib.suppress(FileNotFoundError):
            for entry in sorted(os.listdir(dest_root)):
                if _LEGACY_CONFIG_DIR_RE.match(entry):
                    legacy_candidates.append(
                        os.path.join(dest_root, entry, shard_filename)
                    )
            store_root = os.path.join(dest_root, _LEGACY_STORE_DIR)
            if os.path.isdir(store_root):
                for ckpt in sorted(os.listdir(store_root)):
                    legacy_candidates.append(
                        os.path.join(store_root, ckpt, shard_filename)
                    )
        for candidate in legacy_candidates:
            if (
                os.path.isfile(candidate)
                and not os.path.islink(candidate)
                and os.path.getsize(candidate) == src_size
            ):
                try:
                    os.link(candidate, blob_path)
                    return blob_path
                except OSError:
                    break

        tmp_path = blob_path + ".tmp"
        shutil.copy2(src_blob, tmp_path)
        os.replace(tmp_path, blob_path)
        return blob_path


    def stage_shards(
        source_dir: str,
        dest_root: str,
        local_layer_range: tuple[int, int] | None,
        *,
        is_first_pipeline_rank: bool = True,
        is_last_pipeline_rank: bool = True,
    ) -> str:
        source_dir = os.path.abspath(source_dir)
        index_path = os.path.join(source_dir, SAFE_WEIGHTS_INDEX_NAME)
        with open(index_path, "rb") as f:
            index_bytes = f.read()
        weight_map: dict[str, str] = json.loads(index_bytes)["weight_map"]

        needs_copy = _classify_shards(
            weight_map,
            local_layer_range,
            is_first_pipeline_rank=is_first_pipeline_rank,
            is_last_pipeline_rank=is_last_pipeline_rank,
        )

        repo_name, rev = _parse_source_snapshot(source_dir)
        repo_dir = _local_repo_dir(dest_root, repo_name)
        blobs_dir = os.path.join(repo_dir, "blobs")
        snap_dir = os.path.join(repo_dir, "snapshots", rev)

        if _is_complete(snap_dir, source_dir, blobs_dir, needs_copy):
            return snap_dir

        os.makedirs(snap_dir, exist_ok=True)
        os.makedirs(os.path.join(repo_dir, "refs"), exist_ok=True)
        with open(os.path.join(repo_dir, "refs", "main"), "w") as f:
            f.write(rev)

        for entry in os.listdir(source_dir):
            src_path = os.path.join(source_dir, entry)
            if entry.endswith(".safetensors") or not os.path.isfile(src_path):
                continue
            dst_path = os.path.join(snap_dir, entry)
            if os.path.islink(dst_path):
                os.remove(dst_path)
            shutil.copy2(src_path, dst_path)

        # Original, unmodified index -- every shard filename it references must
        # resolve in snap_dir or vLLM's filter_duplicate_safetensors_files
        # raises FileNotFoundError.
        shutil.copy2(index_path, os.path.join(snap_dir, SAFE_WEIGHTS_INDEX_NAME))

        for shard_filename, owned in needs_copy.items():
            dst_path = os.path.join(snap_dir, shard_filename)
            if os.path.islink(dst_path) or os.path.exists(dst_path):
                os.remove(dst_path)
            if owned:
                target = _ensure_local_blob(
                    dest_root, blobs_dir, source_dir, shard_filename
                )
            else:
                target = _source_blob(source_dir, shard_filename)
            os.symlink(target, dst_path)

        with open(os.path.join(snap_dir, COMPLETE_MARKER), "w") as f:
            f.write("")

        return snap_dir


    def gc_dest_root(
        dest_root: str, keep_dir: str, source_dir: str | None = None
    ) -> dict[str, int]:
        """Prune legacy layout directories, snapshots of other revisions, and
        blobs from other checkpoints. Blobs belonging to the current checkpoint
        (present in the source snapshot's etag set) are kept even when the
        current partition does not reference them -- partitions add onto each
        other against one checkpoint."""
        keep_dir = os.path.realpath(keep_dir)
        removed = {"legacy_dirs": 0, "snapshots": 0, "blobs": 0}

        for entry in sorted(os.listdir(dest_root)):
            path = os.path.join(dest_root, entry)
            if not os.path.isdir(path):
                continue
            if _LEGACY_CONFIG_DIR_RE.match(entry) or entry == _LEGACY_STORE_DIR:
                shutil.rmtree(path)
                removed["legacy_dirs"] += 1

        repo_dir = os.path.dirname(os.path.dirname(keep_dir))
        snapshots_dir = os.path.join(repo_dir, "snapshots")
        if os.path.isdir(snapshots_dir):
            for entry in sorted(os.listdir(snapshots_dir)):
                path = os.path.join(snapshots_dir, entry)
                if os.path.realpath(path) != keep_dir:
                    shutil.rmtree(path)
                    removed["snapshots"] += 1

        keep_etags: set[str] = set()
        if source_dir is not None:
            for name in os.listdir(source_dir):
                path = os.path.join(source_dir, name)
                if name.endswith(".safetensors") and os.path.exists(path):
                    keep_etags.add(os.path.basename(os.path.realpath(path)))
        else:
            # No source to define the checkpoint: fall back to keeping what the
            # surviving snapshot references.
            for name in os.listdir(keep_dir):
                path = os.path.join(keep_dir, name)
                if os.path.islink(path):
                    keep_etags.add(os.path.basename(os.path.realpath(path)))

        blobs_dir = os.path.join(repo_dir, "blobs")
        if os.path.isdir(blobs_dir):
            for name in sorted(os.listdir(blobs_dir)):
                if name not in keep_etags:
                    os.remove(os.path.join(blobs_dir, name))
                    removed["blobs"] += 1

        return removed


    def _resolve_local_layer_range(
        source_dir: str, pp_rank: int, pp_size: int, trust_remote_code: bool = False
    ) -> tuple[int, int] | None:
        if pp_size <= 1:
            return None
        if not 0 <= pp_rank < pp_size:
            raise ValueError(f"{pp_rank=} must be in [0, {pp_size})")

        partition = os.environ.get("VLLM_PP_LAYER_PARTITION")
        if partition is not None:
            try:
                partitions = [int(count) for count in partition.split(",")]
            except ValueError as err:
                raise ValueError(f"Invalid partition string: {partition}") from err
            if len(partitions) != pp_size:
                raise ValueError(f"{len(partitions)=} does not match {pp_size=}.")
            if any(count < 0 for count in partitions):
                raise ValueError(f"Partition counts must be non-negative: {partition}")
            start_layer = sum(partitions[:pp_rank])
            return start_layer, start_layer + partitions[pp_rank]

        # Shard staging only needs the layer count. Constructing ModelConfig also
        # performs architecture inspection, which can reject a valid checkpoint
        # when the serving image and checkpoint override evolve independently.
        # Read the standard HF field directly and leave architecture validation to
        # the actual vLLM server startup.
        del trust_remote_code
        config_path = os.path.join(source_dir, "config.json")
        with open(config_path, encoding="utf-8") as config_file:
            config = json.load(config_file)
        total_num_hidden_layers = config.get("num_hidden_layers")
        if total_num_hidden_layers is None and isinstance(
            config.get("text_config"), dict
        ):
            total_num_hidden_layers = config["text_config"].get("num_hidden_layers")
        if (
            isinstance(total_num_hidden_layers, bool)
            or not isinstance(total_num_hidden_layers, int)
            or total_num_hidden_layers <= 0
        ):
            raise ValueError(
                f"No positive integer num_hidden_layers in {config_path}"
            )

        from vllm.distributed.utils import get_pp_indices

        return get_pp_indices(total_num_hidden_layers, pp_rank, pp_size)


    def main(argv: list[str] | None = None) -> int:
        parser = argparse.ArgumentParser(description=__doc__)
        parser.add_argument("--source-dir", required=True)
        parser.add_argument("--dest-root", required=True)
        parser.add_argument("--pp-rank", type=int, required=True)
        parser.add_argument("--pp-size", type=int, required=True)
        parser.add_argument("--trust-remote-code", action="store_true")
        parser.add_argument(
            "--gc",
            action="store_true",
            help="after staging, prune legacy layouts, other snapshots, and "
            "unreferenced local blobs",
        )
        args = parser.parse_args(argv)

        local_layer_range = _resolve_local_layer_range(
            args.source_dir, args.pp_rank, args.pp_size, args.trust_remote_code
        )
        snap_dir = stage_shards(
            args.source_dir,
            args.dest_root,
            local_layer_range,
            is_first_pipeline_rank=args.pp_rank == 0,
            is_last_pipeline_rank=args.pp_rank == args.pp_size - 1,
        )
        if args.gc:
            removed = gc_dest_root(
                args.dest_root, keep_dir=snap_dir, source_dir=args.source_dir
            )
            print(
                f"[prep-gc] removed {removed['legacy_dirs']} legacy dirs, "
                f"{removed['snapshots']} stale snapshots, "
                f"{removed['blobs']} unreferenced blobs",
                file=sys.stderr,
            )
        print(snap_dir)
        return 0


    if __name__ == "__main__":
        sys.exit(main())
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: dsv4-bench-proof-010
  namespace: inference
  labels:
    kueue.x-k8s.io/queue-name: tb-chain
spec:
  replicatedJobs:
    - name: rank
      replicas: 1
      template:
        spec:
          completions: 10
          parallelism: 10
          completionMode: Indexed
          backoffLimit: 0
          template:
            metadata:
              labels:
                appmana.com/tb-chain-hostnet: primary
                appmana.com/tb-chain-nccl-transport: ibverbs
              annotations:
                kueue.x-k8s.io/podset-required-topology: appmana.com/tb-chain-name
                kueue.x-k8s.io/podset-slice-required-topology: appmana.com/tb-chain-index
                kueue.x-k8s.io/podset-slice-size: "1"
                kueue.x-k8s.io/tas-ordered-evictable: "true"
            spec:
              restartPolicy: Never
              hostNetwork: true
              # Without this, run.sh's own `pkill -9 -f 'gcs_server|raylet|...'`
              # and `ray stop --force` (already present, meant to clear stale
              # Ray state before starting fresh) can only see processes in
              # THIS container's own PID namespace -- hostNetwork shares the
              # port space across pods on a node but not the PID namespace,
              # so a Ray GCS/raylet left behind by a prior pod on the same
              # node is invisible to that cleanup. Confirmed live 2026-07-16:
              # a retry's engine core failed with
              # "ActorHandle ... created in job 03000000, but the current
              # job is 04000000" -- Ray's own job counter incrementing
              # across separate pod attempts is a symptom of exactly this,
              # port 26379 (shared via hostNetwork) landing on stale GCS
              # state instead of a clean start. Same pattern already used
              # by the seaweedfs-node DaemonSet for the same reason.
              hostPID: true
              dnsPolicy: ClusterFirstWithHostNet
              runtimeClassName: nvidia
              enableServiceLinks: false
              imagePullSecrets:
                - name: harbor
              nodeSelector:
                kubernetes.io/os: linux
              containers:
                - name: vllm-bench
                  image: harbor.appmana.com/appmana/vllm-ampere:fence-event-415fe6eed700-1784264073
                  imagePullPolicy: IfNotPresent
                  workingDir: /vllm-workspace
                  command:
                    - /bin/bash
                    - /work/run.sh
                  envFrom:
                    - secretRef:
                        name: hf-token
                  env:
                    - name: HOST_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.hostIP
                    - name: POD_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.name
                    - name: NODE_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: spec.nodeName
                    - name: JOB_COMPLETION_INDEX
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
                    # Stamped by the core JobSet controller (not a webhook,
                    # so no admission-ordering race), unique per JobSet
                    # object and identical across all ranks of one real run
                    # -- unlike JOBSET_NAME, which is a fixed human-chosen
                    # string reused across every delete+recreate retry.
                    # RESULT_DIR is scoped by this so a stale done marker or
                    # host-rendezvous file from a prior attempt of the same
                    # named JobSet can never be mistaken for the current
                    # one's state.
                    - name: APPMANA_JOBSET_UID
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-uid']
                    - name: JOBSET_NAME
                      value: dsv4-bench-proof-010
                    - name: WORLD_SIZE
                      value: "10"
                    - name: APPMANA_DSV4_REPO_ID
                      value: appmana/deepseek-v4-int4-int8
                    - name: APPMANA_DSV4_USE_SHARED_MODEL_PATH
                      value: "0"
                    - name: APPMANA_DSV4_REQUIRE_LOCAL_MODEL_PATH
                      value: "1"
                    - name: APPMANA_DSV4_KV_CACHE_MEMORY_BYTES
                      value: "1073741824"
                    - name: APPMANA_DSV4_MAX_NUM_BATCHED_TOKENS
                      value: "1024"
                    - name: APPMANA_DSV4_MAX_NUM_SEQS
                      value: "6"
                    - name: APPMANA_DSV4_LONG_PREFILL_TOKEN_THRESHOLD
                      value: "4096"
                    - name: APPMANA_DSV4_STREAM_INTERVAL
                      value: "4"
                    - name: VLLM_PIPELINE_PARALLEL_SIZE
                      value: "10"
                    - name: VLLM_TENSOR_PARALLEL_SIZE
                      value: "1"
                    - name: VLLM_USE_V2_MODEL_RUNNER
                      value: "1"
                    - name: VLLM_MHC_POST_TRITON
                      value: "1"
                    - name: VLLM_MHC_HEAD_TRITON
                      value: "1"
                    - name: VLLM_MHC_PRE_TRITON
                      value: "1"
                    - name: VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS
                      value: "1800"
                    - name: VLLM_ENGINE_ITERATION_TIMEOUT_S
                      value: "1800"
                    - name: NCCL_P2P_DISABLE
                      value: "0"
                    - name: NCCL_DEBUG
                      value: WARN
                    - name: NCCL_DEBUG_SUBSYS
                      value: INIT,NET,GRAPH,TUNING
                    - name: LD_PRELOAD
                      value: /usr/lib/x86_64-linux-gnu/libnccl.so.2.30.7
                    - name: TRITON_CACHE_DIR
                      value: /jit-local/jobset-proof/triton
                    - name: TORCH_EXTENSIONS_DIR
                      value: /jit-local/jobset-proof/torch-ext
                    - name: CUDA_CACHE_PATH
                      value: /jit-local/jobset-proof/cuda
                    - name: TORCHINDUCTOR_CACHE_DIR
                      value: /jit-local/jobset-proof/inductor
                    - name: XDG_CACHE_HOME
                      value: /jit-local/jobset-proof/xdg
                    - name: TORCH_CUDA_ARCH_LIST
                      value: "8.6"
                    - name: MAX_JOBS
                      value: "2"
                    - name: CUDA_VISIBLE_DEVICES
                      value: "0"
                  resources:
                    requests:
                      cpu: "4"
                      memory: 12Gi
                      nvidia.com/gpu: "1"
                    limits:
                      memory: 48Gi
                      nvidia.com/gpu: "1"
                  volumeMounts:
                    - name: script
                      mountPath: /work
                    - name: hf-cache
                      mountPath: /hf-cache
                    - name: jit-cache-shared
                      mountPath: /jit-shared
                    - name: jit-cache-local
                      mountPath: /jit-local
                    - name: shard-cache-local
                      mountPath: /shard-cache-local
                    - name: dshm
                      mountPath: /dev/shm
                    - name: hf-cache-bootstrap-scripts
                      mountPath: /opt/appmana-hf-cache
                      readOnly: true
              volumes:
                - name: script
                  configMap:
                    name: dsv4-benchmark-jobset-proof-script
                    defaultMode: 0555
                - name: hf-cache
                  persistentVolumeClaim:
                    claimName: hf-cache-seaweed
                - name: jit-cache-shared
                  persistentVolumeClaim:
                    claimName: jit-cache-shared-seaweed
                - name: jit-cache-local
                  emptyDir:
                    sizeLimit: 50Gi
                - name: shard-cache-local
                  # Must survive pod recreation across JobSet re-runs, not
                  # just process restarts within one pod's life -- emptyDir
                  # and the generic ephemeral-volume PVC (checked: its own
                  # docs say "the PVC will be deleted together with the pod")
                  # both fail that. A real local-path PVC is single-node
                  # (ReadWriteOnce) and this JobSet's 10 ranks share one
                  # volume reference across 10 different chain nodes, so a
                  # single PVC can't be mounted by all of them either.
                  # hostPath is the one option tied to the *node*, not the
                  # pod or a PVC -- same pattern already used for
                  # SeaweedFS's own mount cache (/var/cache/seaweedfs). This
                  # tb-chain topology is physically fixed cabling, so a
                  # given PP rank lands on the same node every run: one
                  # identical hostPath spec across all 10 pod replicas
                  # already resolves to a distinct, stable, per-rank
                  # directory per node -- no per-completion-index injection
                  # needed. prep_pp_shards.py's own cache-key hashing still
                  # scopes each config's subdirectory, so a checkpoint or
                  # pp_size change never collides with stale shards left by
                  # a prior config on the same node.
                  hostPath:
                    path: /var/cache/vllm-shard-staging
                    type: DirectoryOrCreate
                - name: dshm
                  emptyDir:
                    medium: Memory
                    sizeLimit: 24Gi
                - name: hf-cache-bootstrap-scripts
                  configMap:
                    name: hf-cache-bootstrap-scripts
                    defaultMode: 0555
